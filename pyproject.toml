[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-grid-bot"
version = "0.1.0"
description = "Modular Telegram grid-trading bot (paper trading v1) for CoinEx"
requires-python = ">=3.10"
dependencies = [
  "aiogram>=3.4",
  "httpx>=0.27",
  "websockets>=12.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "APScheduler>=3.10",
  "uvloop>=0.19; platform_system == 'Linux'",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
  "E", "F", "I", "N", "UP", "B", "Q", "RET",
]
ignore = ["E501"]

